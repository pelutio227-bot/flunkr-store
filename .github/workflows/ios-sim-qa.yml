name: iOS Simulator QA

# Baut die echte Capacitor-App (WKWebView, capacitor://localhost) fuer den iOS-Simulator, haengt den
# QA-Treiber qa/sim-driver.js ein und spielt den Weg eines NEUEN Users gegen https://flunkr.abooz.ch durch:
# Onboarding → Profil → Proberunde → Home → Spiel erstellen → Konto loeschen. Ergebnis: Konsolen-Log + Screenshots
# als Artefakt «sim-qa». Nur manuell (workflow_dispatch); der Store-Build bleibt davon unberuehrt.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Anzahl frischer Durchlaeufe (App wird jedes Mal neu installiert)"
        type: string
        default: "3"
      device:
        description: "Simulator (Name-Teilstring)"
        type: string
        default: "iPhone 16 Pro"
      touch:
        description: "Finte mit ECHTEN Taps + Bildschirmtastatur (idb) eingeben"
        type: boolean
        default: true

jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Xcode waehlen
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X" || true
          xcodebuild -version
      - name: Web-Export + QA-Treiber
        run: |
          bun install
          FLUNKR_DIST=web bun run build
          cp qa/sim-driver.js www/sim-driver.js
          sed -i '' 's#</head>#<script src="/sim-driver.js"></script>\n</head>#' www/index.html
          if [ "${{ inputs.touch }}" = "true" ]; then sed -i '' 's#<script src="/sim-driver.js">#<script>window.__QA_TOUCH=1</script><script src="/sim-driver.js">#' www/index.html; fi
          grep -c sim-driver www/index.html
          bunx cap sync ios
      - name: Build fuer Simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tail -25
          ls build/sim/Build/Products/Debug-iphonesimulator/
      - name: idb (echte Taps) + Bildschirmtastatur
        if: ${{ inputs.touch }}
        run: |
          brew tap facebook/fb >/dev/null && brew install idb-companion >/dev/null 2>&1 || brew install facebook/fb/idb-companion
          pip3 install --break-system-packages fb-idb >/dev/null 2>&1 || pip3 install fb-idb
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          which idb && idb --help | head -3
      - name: Simulator-Laeufe
        env:
          TOUCH: ${{ inputs.touch }}
          RUNS: ${{ inputs.runs }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -u
          mkdir -p out
          APP=build/sim/Build/Products/Debug-iphonesimulator/App.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; n=os.environ['DEVICE']; l=[x for k,v in d.items() if 'iOS' in k for x in v if n in x['name']]; l=l or [x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]; print(l[-1]['udid'])")
          echo "Simulator $UDID"
          defaults write com.apple.iphonesimulator DevicePreferences -dict-add "$UDID" '{ ConnectHardwareKeyboard = 0; }' || true
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
          if [ "$TOUCH" = "true" ]; then idb_companion --udid "$UDID" > out/idb-companion.log 2>&1 & sleep 5; idb connect localhost 10882 || idb connect "$UDID" || true; fi
          ok=0
          for i in $(seq 1 "$RUNS"); do
            echo "=== Lauf $i ==="
            xcrun simctl uninstall "$UDID" com.pelutio.flunkr || true
            xcrun simctl install "$UDID" "$APP"
            ( xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.pelutio.flunkr > out/run$i-console.log 2>&1 & )
            n=0
            while [ $n -lt 160 ]; do
              sleep 3; n=$((n+1))
              [ $((n % 3)) -eq 0 ] && xcrun simctl io "$UDID" screenshot --type=jpeg "out/run$i-$(printf %03d $n).jpg" >/dev/null 2>&1
              grep -q "QA-DONE" out/run$i-console.log && break
              if [ "$TOUCH" = "true" ] && [ ! -f out/run$i-touch.done ] && grep -q "QA-RECT" out/run$i-console.log; then
                L=$(grep "QA-RECT" out/run$i-console.log | tail -1); echo "$L"
                IX=$(echo "$L" | awk '{for(i=1;i<=NF;i++) if($i=="input"){print $(i+1); exit}}'); IY=$(echo "$L" | awk '{for(i=1;i<=NF;i++) if($i=="input"){print $(i+2); exit}}')
                BX=$(echo "$L" | awk '{for(i=1;i<=NF;i++) if($i=="button"){print $(i+1); exit}}'); BY=$(echo "$L" | awk '{for(i=1;i<=NF;i++) if($i=="button"){print $(i+2); exit}}')
                xcrun simctl io "$UDID" screenshot --type=jpeg "out/run$i-touch-1-vorher.jpg" >/dev/null 2>&1
                idb ui tap --udid "$UDID" "$IX" "$IY"; sleep 2.5
                xcrun simctl io "$UDID" screenshot --type=jpeg "out/run$i-touch-2-tastatur.jpg" >/dev/null 2>&1
                grep "QA-RECT" out/run$i-console.log | tail -1 | tee out/run$i-touch-rect-tastatur.txt
                idb ui text --udid "$UDID" "Alpakas"; sleep 1.5
                xcrun simctl io "$UDID" screenshot --type=jpeg "out/run$i-touch-3-getippt.jpg" >/dev/null 2>&1
                # Knopf an seiner aktuellen Stelle (Layout aendert sich mit offener Tastatur): letzte Messung aus dem Log
                L=$(grep "QA-RECT" out/run$i-console.log | tail -1); echo "$L"
                BX=$(echo "$L" | awk '{for(i=1;i<=NF;i++) if($i=="button"){print $(i+1); exit}}'); BY=$(echo "$L" | awk '{for(i=1;i<=NF;i++) if($i=="button"){print $(i+2); exit}}')
                idb ui tap --udid "$UDID" "$BX" "$BY"; sleep 2
                xcrun simctl io "$UDID" screenshot --type=jpeg "out/run$i-touch-4-abgeschickt.jpg" >/dev/null 2>&1
                echo "touch: input $IX,$IY button $BX,$BY" | tee out/run$i-touch.done
              fi
            done
            xcrun simctl io "$UDID" screenshot --type=jpeg "out/run$i-zz-final.jpg" >/dev/null 2>&1 || true
            grep "QA|" out/run$i-console.log | tail -400 > out/run$i-qa.log || true
            if grep -q "QA-DONE OK" out/run$i-console.log; then echo "Lauf $i OK"; ok=$((ok+1)); else echo "Lauf $i FEHLER"; tail -60 out/run$i-qa.log; fi
            xcrun simctl terminate "$UDID" com.pelutio.flunkr || true
          done
          echo "Ergebnis: $ok / $RUNS OK" | tee out/summary.txt
          [ "$ok" = "$RUNS" ]
      - name: Artefakte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-qa
          path: out/
